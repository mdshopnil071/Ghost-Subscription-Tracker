<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Subscription Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand">
      <span class="ghost-icon">👻</span>
      <h1>Ghost Subscription Tracker</h1>
    </div>
    <p class="tagline">Never let a forgotten subscription drain your wallet again</p>
  </header>

  <!-- CARDS CONTAINER -->
  <section class="cards-grid" id="cardsContainer"></section>
  <p class="empty-msg" id="emptyMsg">No subscriptions added yet!</p>

  <!-- ===== ANIMATED BACKGROUND: Falling subscription/brand logos ===== -->
<div class="logo-rain" id="logoRain" aria-hidden="true"></div>

  <footer>
    <p>Ghost Subscription Tracker &copy; 2026 All Rights Reserved</p>
    <p>Developed by Md. Khairul Anam Shopnil</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
